<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <link href="./node_modules/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet">

    <style>
        html, body, #map {
            margin: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script type="module">

import * as maplibregl from "./node_modules/maplibre-gl/dist/maplibre-gl.mjs";


const map = new maplibregl.Map({
    container: "map",

    style: "http://localhost:8080/styles/basic-preview/style.json",

    center: [37.7097, 55.7044],
    zoom: 9
});


let route = [];
let marker = null;


map.on("load", () => {

    map.addSource("route", {
        type: "geojson",

        data: {
            type: "Feature",
            properties: {},

            geometry: {
                type: "LineString",
                coordinates: []
            }
        }
    });


    map.addLayer({
        id: "route",

        type: "line",

        source: "route",

        paint: {
            "line-width": 5
        }
    });

});


// Делаем функцию доступной глобально,
// чтобы её можно было вызвать из C++
window.updatePosition = function(latitude, longitude)
{
    const position = [
        longitude,
        latitude
    ];


    route.push(position);


    if (marker === null)
    {
        marker = new maplibregl.Marker()
            .setLngLat(position)
            .addTo(map);
    }
    else
    {
        marker.setLngLat(position);
    }


    const source = map.getSource("route");

    if (source)
    {
        source.setData({
            type: "Feature",
            properties: {},

            geometry: {
                type: "LineString",
                coordinates: route
            }
        });
    }


    map.panTo(position);
};

</script>

</body>
</html>
